<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andy Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f0d;
      --surface: #111a14;
      --border: rgba(255,255,255,0.08);
      --gold: #c9a84c;
      --green: #4ade80;
      --muted: rgba(255,255,255,0.35);
      --text: rgba(255,255,255,0.88);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 100% 40% at 50% 0%, #1a3320 0%, transparent 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -0.02em;
      text-shadow: 0 0 20px rgba(201,168,76,0.4);
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--green);
      font-weight: 600;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .placeholder {
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.04) 0px,
        rgba(255,255,255,0.04) 60px,
        transparent 60px,
        transparent 80px
      );
      border-radius: 4px;
      height: 1.6rem;
      width: 80%;
      margin-top: 0.25rem;
    }

    .section-title {
      max-width: 900px;
      margin: 2rem auto 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .coming-soon {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .coming-soon strong {
      display: block;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    footer {
      max-width: 900px;
      margin: 3rem auto 0;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Andy</div>
    <div class="status-dot"><span class="dot"></span> Online</div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-label">Portfolio Value</div>
      <div class="placeholder"></div>
      <div class="card-sub">Wallets not yet connected</div>
    </div>
    <div class="card">
      <div class="card-label">Active Nodes</div>
      <div class="placeholder"></div>
      <div class="card-sub">Node monitor coming soon</div>
    </div>
    <div class="card">
      <div class="card-label">Open Tasks</div>
      <div class="placeholder"></div>
      <div class="card-sub">Task sync coming soon</div>
    </div>
  </div>

  <p class="section-title">Modules</p>

  <div class="coming-soon">
    <strong>Dashboard under construction</strong>
    Andy will fill this in — ask him to build out any module from WhatsApp.
  </div>

  <footer>
    Built by Andy · Last updated <span id="ts"></span>
  </footer>

  <script>
    document.getElementById('ts').textContent = new Date().toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric'
    });
  </script>

</body>
</html>
